name: cobrewer_mobile
description: "Cobrewer — the coffee brewing co-pilot, mobile client."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Shrikhand
      fonts:
        - asset: fonts/Shrikhand-Regular.ttf
    - family: Baloo 2
      fonts:
        - asset: fonts/Baloo2-Regular.ttf
        - asset: fonts/Baloo2-Medium.ttf
          weight: 500
        - asset: fonts/Baloo2-SemiBold.ttf
          weight: 600
        - asset: fonts/Baloo2-Bold.ttf
          weight: 700
